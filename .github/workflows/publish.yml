# OWITH.ai: publish the episode staged by the Claude cloud job.
# Security notes:
#  - Triggered only by schedule or manual dispatch, so the workflow definition always comes
#    from the protected main branch. A push to another branch can never change what runs here.
#  - The Buzzsprout token is an Environment secret on "buzzsprout", which is restricted to
#    the main branch (Settings > Environments > buzzsprout > Deployment branches: main).
#  - The staged files are read as data. No code from the audio-inbox branch is executed.
name: publish-episode

on:
  schedule:
    - cron: "20 4 * * *"   # 04:20 UTC, i.e. 05:20 Zurich in winter, 06:20 in summer
  workflow_dispatch:
    inputs:
      target_date:
        description: "Episode date YYYY-MM-DD (default: today in Zurich)"
        required: false
      check_only:
        description: "Validate staged files and test the token only; upload nothing"
        type: boolean
        default: true
      dry_run:
        description: "Upload as private episode"
        type: boolean
        default: false

permissions:
  contents: write   # needed only to create the archive Release

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: buzzsprout
    timeout-minutes: 30
    steps:
      - name: Check out main (trusted code)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve target date
        id: date
        run: |
          D="${{ github.event.inputs.target_date }}"
          if [ -z "$D" ]; then D=$(TZ=Europe/Zurich date +%F); fi
          echo "$D" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "bad date"; exit 1; }
          echo "target=$D" >> "$GITHUB_OUTPUT"

      - name: Skip if already archived
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "ep-${{ steps.date.outputs.target }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "Already published"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch staged files as data
        if: steps.exists.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staged
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --depth=1 origin audio-inbox
          D="${{ steps.date.outputs.target }}"
          for f in episode.json script.md sources.md render.json episode.mp3 episode.wav; do
            git show "FETCH_HEAD:$D/$f" > "staged/$f" 2>/dev/null || rm -f "staged/$f"
          done
          ls -la staged

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.done == 'false'
        with:
          python-version: "3.12"

      - name: Publish to Buzzsprout
        id: pub
        if: steps.exists.outputs.done == 'false'
        env:
          BUZZSPROUT_TOKEN: ${{ secrets.BUZZSPROUT_TOKEN }}
          BUZZSPROUT_PODCAST_ID: ${{ vars.BUZZSPROUT_PODCAST_ID }}
        run: |
          pip install -q requests==2.32.3
          python publisher/publish.py staged "${{ steps.date.outputs.target }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.check_only == 'true' && '--check-only' || '' }}

      - name: Archive as GitHub Release
        if: steps.exists.outputs.done == 'false' && github.event.inputs.dry_run != 'true' && github.event.inputs.check_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="${{ steps.date.outputs.target }}"
          gh release create "ep-$D" -R "$GITHUB_REPOSITORY" \
            --title "$D | Episode ${{ steps.pub.outputs.episode_number }}" \
            --notes-file staged/script.md \
            staged/episode.mp3 staged/episode.json staged/script.md staged/sources.md \
            staged/render.json staged/published.json \
            $( [ -f staged/episode.wav ] && echo staged/episode.wav )
